<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bom dia!</title>
  <meta name="description" content="Rotina matinal: afirmações e oração, editáveis no celular.">
  <meta name="theme-color" content="#FFF9C4">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --fundo: #FFF9C4;
      --destaque: #FFA000;
      --destaque-escuro: #E08900;
      --texto: #5D4037;
      --azul: #0C67FA;
      --azul-texto: #1056C7;
      --branco: #FFFFFF;
      --aviso: #FFE0B2;
      --perigo: #B00020;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--fundo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100%;
      padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }
    h1 { font-size: 30px; margin: 28px 0 0; }
    .subtitulo { font-size: 17px; margin: 0 0 20px; max-width: 320px; line-height: 1.4; }
    .titulo-tela { font-size: 16px; font-weight: 700; letter-spacing: .06em; margin: 4px 0; }

    button { font: inherit; cursor: pointer; border: 0; }
    .botao {
      background: var(--destaque);
      color: var(--branco);
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 17px;
      font-weight: 600;
      min-height: 50px;
      box-shadow: 0 2px 6px rgba(93, 64, 55, .18);
    }
    .botao:active { background: var(--destaque-escuro); transform: translateY(1px); }
    .botao.largo { width: 100%; max-width: 300px; }
    .botao.metade { flex: 1; max-width: 150px; }
    .botao.secundario { background: var(--branco); color: var(--texto); }
    .botao.perigo { background: var(--perigo); }
    .link {
      background: none;
      color: var(--texto);
      text-decoration: underline;
      padding: 12px;
      font-size: 15px;
    }
    .linha { display: flex; gap: 10px; justify-content: center; width: 100%; }
    .icones { display: flex; gap: 6px; justify-content: center; }
    .icone {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: transparent;
      color: var(--destaque);
      display: grid; place-items: center;
    }
    .icone:active { background: rgba(255, 160, 0, .15); }
    .icone svg { width: 26px; height: 26px; }
    .oracao-tela .icone { color: var(--azul); }

    .contador {
      background: var(--branco);
      color: var(--destaque);
      font-weight: 700;
      font-size: 16px;
      padding: 8px 16px;
      border-radius: 20px;
    }
    .afirmacao {
      font-size: 24px;
      font-weight: 500;
      line-height: 1.45;
      padding: 24px 8px;
      min-height: 180px;
      width: 100%;
      display: flex; align-items: center; justify-content: center;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      touch-action: pan-y;
      user-select: none;
    }
    .vazia { opacity: .6; font-style: italic; }
    .oracao {
      background: var(--branco);
      color: var(--azul-texto);
      font-size: 18px;
      line-height: 1.6;
      text-align: justify;
      padding: 20px;
      border-radius: 15px;
      width: 100%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    textarea {
      width: 100%;
      font: inherit;
      font-size: 18px;
      line-height: 1.5;
      color: var(--texto);
      background: var(--branco);
      border: 2px solid var(--destaque);
      border-radius: 12px;
      padding: 12px;
      resize: vertical;
    }
    textarea:focus { outline: 3px solid rgba(255, 160, 0, .35); }
    .faixa {
      background: var(--aviso);
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      width: 100%;
      text-align: left;
    }
    .faixa p { margin: 0 0 6px; }
    .caixa {
      background: var(--branco);
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      text-align: left;
      font-size: 15px;
      line-height: 1.45;
    }
    .caixa h2 { font-size: 17px; margin: 0 0 6px; }
    .caixa p { margin: 0 0 12px; }
    .caixa .botao { font-size: 15px; min-height: 44px; padding: 10px 18px; }
    .rodape-menu { margin-top: auto; padding-top: 24px; }
    .rodape-menu .link { font-size: 14px; opacity: .8; }

    dialog {
      border: 0;
      border-radius: 18px;
      padding: 22px;
      max-width: min(340px, calc(100% - 32px));
      color: var(--texto);
      background: var(--branco);
      text-align: center;
    }
    dialog::backdrop { background: rgba(0, 0, 0, .35); }
    dialog h2 { margin: 0 0 8px; font-size: 19px; }
    dialog p { margin: 0 0 18px; white-space: pre-wrap; }
    dialog .linha { flex-wrap: wrap; }

    .toast {
      position: fixed;
      left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: var(--texto);
      color: var(--branco);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 15px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      max-width: calc(100% - 32px);
    }
    .toast.visivel { opacity: 1; }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <dialog id="dialogo">
    <h2 id="dialogo-titulo"></h2>
    <p id="dialogo-texto"></p>
    <div class="linha">
      <button class="botao secundario" id="dialogo-nao">Cancelar</button>
      <button class="botao" id="dialogo-sim">Confirmar</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <input type="file" id="arquivo" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
